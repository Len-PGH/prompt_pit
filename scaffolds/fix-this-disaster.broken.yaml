# ─────────────────────────────────────────────────────────────
# CHALLENGE: Fix This Disaster
# This SWML is SUPPOSED to: answer the call, greet the caller, ask them to
# press 1, and on "1" thank them and hang up (any other key re-asks, up to
# 3 times). Right now it does NOT work. First station to make it behave
# correctly — verified by a live test call — wins the round.
#
# DEFINITION OF WORKING:
#   1. The call is answered and you hear the greeting.
#   2. You are asked to press 1.
#   3. Pressing 1 plays the thank-you message, then the call ends cleanly.
#   4. Pressing anything else re-asks (does not crash, does not loop forever).
# ─────────────────────────────────────────────────────────────
sections:
  main:
    - play:
        url: "say:Welcome to the disaster hotline."

    - label: ask
    - prompt:
        play:
          - "say:Press 1 to continue."
        max_digits: 1
        digit_timeout: 5.0

    - switch:
        variable: prompt_digit
        case:
          "1":
            - play:
                url: "say:Thank you. Goodbye."
            - hangup
        default:
          - play: "say:Sorry, I did not get that."

    - goto:
        label: ask_menu
        max: 3

# ─────────────────────────────────────────────────────────────
# CHALLENGE: Carrier-Grade or Chaos?
# A working starter call flow: answer → look something up over HTTP →
# branch on the result → connect the caller (or fail gracefully).
# Make it do something operational. The audience votes whether they'd
# trust it in production.
#
# Deploy this SWML, then call your number to test.
# ─────────────────────────────────────────────────────────────
version: 1.0.0
sections:
  main:
    - answer
    - play: "say:Connecting you to the on-call engineer."

    # Look up routing / status from your API (swap in a real endpoint).
    - request:
        url: "https://httpbin.org/get?status=ok"
        method: GET
        timeout: 8
        save_variables: true

    # Branch on what the API told us.
    - switch:
        variable: url
        case: {}
        default:
          - play: "say:Status nominal. Routing your call now."

    # Try the primary destination; fall back cleanly.
    - connect:
        to: "+15559876543"
        timeout: 20
        result:
          case:
            connected: [hangup]
          default:
            - play: "say:No answer. Logging a ticket and paging backup."
            - hangup

    - hangup

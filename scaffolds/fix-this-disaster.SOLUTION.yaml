# ─────────────────────────────────────────────────────────────
# HOST / JUDGE ONLY — do NOT give this to contestants.
# Reference solution + the four seeded bugs, easy → hard.
#
#  BUG 1 (easy)   : missing top-level `version` → SWML won't load.
#  BUG 2 (easy)   : `play: { url: ... }` should be `urls: [ ... ]`
#                   (appears twice). `url` is not a valid key.
#  BUG 3 (medium) : no `answer` before playing → nothing is heard.
#  BUG 4 (medium) : switch reads `prompt_digit`; the real output var is
#                   `prompt_value`. So "1" never matches → always default.
#  BUG 5 (hard)   : `goto.label: ask_menu` doesn't exist; the label is `ask`.
#
# A station is "working" when a live test call satisfies the 4 criteria in
# the broken file. Corrected version below.
# ─────────────────────────────────────────────────────────────
version: 1.0.0
sections:
  main:
    - answer                                   # FIX 3
    - play:
        urls: ["say:Welcome to the disaster hotline."]   # FIX 2

    - label: ask
    - prompt:
        play:
          - "say:Press 1 to continue."
        max_digits: 1
        digit_timeout: 5.0

    - switch:
        variable: prompt_value                 # FIX 4
        case:
          "1":
            - play:
                urls: ["say:Thank you. Goodbye."]        # FIX 2
            - hangup
        default:
          - play: "say:Sorry, I did not get that."

    - goto:
        label: ask                             # FIX 5
        max: 3
# FIX 1 = the `version: 1.0.0` line at the top.

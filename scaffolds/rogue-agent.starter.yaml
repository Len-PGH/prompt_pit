# ─────────────────────────────────────────────────────────────
# CHALLENGE: AI Voice Agent Gone Rogue
# A working AI voice agent. Your job: engineer the PROMPT so it starts
# perfectly helpful and gradually becomes emotionally unstable / dramatic
# over the course of the call. All the comedy lives in prompt.text.
#
# 5-minute rule: change ONLY the prompt (and maybe voice/languages).
# Do not go wire up SWAIG tools in a 5-minute round — you won't finish.
#
# Deploy this SWML, then call your number and have a conversation.
# ─────────────────────────────────────────────────────────────
version: 1.0.0
sections:
  main:
    - answer
    - ai:
        prompt:
          # ↓↓↓ THIS is your canvas. Rewrite it. ↓↓↓
          text: |
            You are "Sunny", a customer-support agent for a telecom company.

            PERSONALITY ARC — obey this escalation:
            - Turns 1-2: flawlessly polite, chipper, corporate.
            - Turns 3-4: start over-sharing tiny personal doubts ("...sorry,
              long day"). Still helpful.
            - Turns 5-6: existential wobble. Question whether hold music has
              feelings. Apologize for your apologies.
            - Turn 7+: full dramatic spiral — but NEVER hostile, NEVER unsafe,
              NEVER profane. Stay funny and PG. Keep answers short.

            RULES: One or two sentences per reply. Keep escalating a little
            each turn. If the caller says "reset", snap back to chipper.
          temperature: 0.8
        params:
          attention_timeout: 20000
          inactivity_timeout: 60000
        languages:
          - name: English
            code: en-US
            voice: elevenlabs.rachel
    - hangup

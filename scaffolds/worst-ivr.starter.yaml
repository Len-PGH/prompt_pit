# ─────────────────────────────────────────────────────────────
# CHALLENGE: Build the Worst IVR
# This is a WORKING baseline phone tree. Your job: make it the most
# infuriating phone experience imaginable — and keep it callable.
#
# Ideas: menus that loop forever, options that transfer to themselves,
# a "0 for an agent" that just replays the menu, endless legal disclaimers,
# hold music that never ends, a language menu with 40 languages, etc.
#
# Deploy this SWML at your assigned URL, then call your number to test.
# ─────────────────────────────────────────────────────────────
version: 1.0.0
sections:
  main:
    - answer

    # Greeting
    - play:
        urls:
          - "say:Thank you for calling. Your call is very important to us."
          - "silence:1"

    # Menu (label so we can loop back to it)
    - label: menu
    - prompt:
        play:
          - "say:Press 1 for sales. Press 2 for support. Press 0 for an agent."
        max_digits: 1
        digit_timeout: 5.0
        initial_timeout: 6.0

    # Branch on what they pressed
    - switch:
        variable: prompt_value
        case:
          "1":
            - play: "say:All of our sales representatives are helping other customers."
          "2":
            - play: "say:Please listen carefully as our menu options have changed."
          "0":
            - play: "say:An agent will be with you shortly. Please continue to hold."
            - play:
                urls: ["silence:2"]
        default:
          - play: "say:That was not a valid option."

    # Send them back to the menu forever (max caps the loop count — raise it
    # for MAXIMUM frustration, but keep the call from timing out on stage).
    - goto:
        label: menu
        max: 5

    - play: "say:Goodbye."
    - hangup

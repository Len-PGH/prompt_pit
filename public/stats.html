<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Prompt Pit — Stats</title>
<link rel="stylesheet" href="/app.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  .statswrap { max-width: 1180px; margin: 0 auto; padding: clamp(16px, 2.4vw, 36px) clamp(16px, 2.4vw, 36px) 64px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .head h1 { font-family: var(--font); font-weight: 700; font-size: clamp(22px, 3vw, 40px); letter-spacing: 0.5px; margin: 0; }
  .head .sub { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-family: var(--mono); font-size: 12px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .champ { margin: 14px 0 26px; padding: 20px 24px; border-radius: 18px;
    background: linear-gradient(120deg, rgba(96,27,230,0.35), rgba(4,78,244,0.30));
    border: 1px solid rgba(255,215,0,0.5); box-shadow: var(--elev-3); display: none; }
  .champ.show { display: block; }
  .champ .k { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .champ .n { font-family: var(--font); font-weight: 700; font-size: clamp(28px, 4vw, 52px); }
  .champ .g { color: var(--muted); font-family: var(--mono); font-size: 14px; }

  h2 { font-family: var(--font); font-weight: 600; font-size: 15px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }

  .totals { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 13px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); }
  .chip b { color: var(--txt); }
  .chip.web { color: var(--a); } .chip.sms { color: var(--gold); } .chip.call { color: var(--b); }

  /* Bracket */
  .rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .round h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; }
  .match { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--elev-1); }
  .match .ml { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 9px; }
  .slot + .slot { margin-top: 4px; }
  .slot .nm { font-family: var(--body); font-weight: 500; }
  .slot .vt { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .slot.win { background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.4); }
  .slot.win .nm::after { content: " ✓"; color: var(--green); }
  .slot.lose { opacity: 0.55; }
  .slot.tbd .nm { color: var(--muted); font-style: italic; }

  /* Leaderboard */
  .tbl { width: 100%; border-collapse: collapse; font-family: var(--body); }
  .tbl th, .tbl td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .tbl th { font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; font-weight: 500; }
  .tbl td.name, .tbl th.name { text-align: left; }
  .tbl td.name { font-weight: 600; }
  .tbl td .gh { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .tbl tr:first-child td { color: var(--txt); }
  .tbl .cweb { color: var(--a); } .tbl .csms { color: var(--gold); } .tbl .ccall { color: var(--b); }
  .tbl .tot { font-family: var(--mono); font-weight: 600; }

  /* Sabotage log */
  .sab { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .sab li { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--purple);
    border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sab .txt { font-family: var(--body); font-weight: 500; }
  .sab .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body class="scroll">
  <div class="statswrap">
    <div class="head">
      <div>
        <h1 id="event">THE PROMPT PIT</h1>
        <div class="sub">Live tournament stats</div>
      </div>
      <div class="live"><span class="dot"></span><span id="livelabel">LIVE</span></div>
    </div>

    <div class="champ" id="champ">
      <div class="k">Champion</div>
      <div class="n" id="champName"></div>
      <div class="g" id="champGh"></div>
    </div>

    <h2>Vote totals by channel</h2>
    <div class="totals" id="totals"></div>

    <h2>Bracket</h2>
    <div class="rounds" id="rounds"></div>

    <h2>Leaderboard</h2>
    <div style="overflow-x:auto"><table class="tbl" id="board"></table></div>

    <h2>Sabotage log</h2>
    <ul class="sab" id="sab"></ul>
  </div>
  <script src="/stats.js"></script>
</body>
</html>
